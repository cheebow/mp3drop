name: MP3Drop
options:
  bundleIdPrefix: com.cheebow
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: true
    DEAD_CODE_STRIPPING: true
    SWIFT_TREAT_WARNINGS_AS_ERRORS: false

targets:
  MP3Drop:
    type: application
    platform: macOS
    sources:
      - path: MP3Drop
    dependencies:
      - framework: Frameworks/libmp3lame.xcframework
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cheebow.MP3Drop
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        MARKETING_VERSION: "1.0.2"
        CURRENT_PROJECT_VERSION: "3"
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: MP3Drop/Info.plist
        CODE_SIGN_ENTITLEMENTS: MP3Drop/MP3Drop.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: XGR4L2TKWW
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: true
        ENABLE_APP_SANDBOX: true

  MP3DropTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MP3DropTests
    dependencies:
      - target: MP3Drop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cheebow.MP3DropTests
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: XGR4L2TKWW

schemes:
  MP3Drop:
    build:
      targets:
        MP3Drop: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MP3DropTests
