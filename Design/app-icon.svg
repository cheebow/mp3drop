<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d8eb"/>
      <stop offset="0.55" stop-color="#1b8fe0"/>
      <stop offset="1" stop-color="#2743c9"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dcefff"/>
    </linearGradient>
    <filter id="dropShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#0a2a66" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- macOS squircle background -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>

  <!-- subtle top sheen -->
  <path d="M 100 286 Q 512 150 924 286 L 924 286 L 924 286 C 924 180 844 100 738 100 L 286 100 C 180 100 100 180 100 286 Z" fill="#ffffff" opacity="0.12"/>

  <!-- ripple rings at bottom -->
  <g fill="none" stroke="#ffffff" opacity="0.35">
    <ellipse cx="512" cy="800" rx="150" ry="34" stroke-width="10"/>
    <ellipse cx="512" cy="804" rx="245" ry="52" stroke-width="7" opacity="0.6"/>
  </g>

  <!-- water drop -->
  <path filter="url(#dropShadow)" fill="url(#drop)"
        d="M 512 196
           C 512 196 316 452 316 592
           A 196 196 0 0 0 708 592
           C 708 452 512 196 512 196 Z"/>

  <!-- eighth note (♪ glyph from Hiragino Sans) inside the drop -->
  <text x="512" y="708" font-size="460" text-anchor="middle"
        font-family="Hiragino Sans" fill="#1b67d6">&#9834;</text>
</svg>
